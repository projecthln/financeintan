    // ============================================================================
    // 3. CENTRAL ACCOUNTING ENGINE (STRICT 12 ACCOUNTING RULES)
    // ============================================================================
    function computeFinancialEngine(state) {
      const activeAccounts = (state.accounts || []).filter((a) => !a.deletedAt && !a.isArchived);
      const activeTx = (state.transactions || []).filter((t) => !t.deletedAt);
      const activeInvoices = (state.businessInvoices || []).filter((inv) => !inv.deletedAt && inv.status !== 'cancelled');
      const activeUnits = (state.businessUnits || []).filter((u) => !u.deletedAt && !u.isArchived);

      const accountBalances = {};
      activeAccounts.forEach((acc) => {
        accountBalances[acc.id] = Number(acc.initialBalance) || 0;
      });

      activeTx.forEach((tx) => {
        const amt = Number(tx.amount) || 0;
        if (tx.sourceAccountId && accountBalances[tx.sourceAccountId] !== undefined) {
          accountBalances[tx.sourceAccountId] -= amt;
        }
        if (tx.destinationAccountId && accountBalances[tx.destinationAccountId] !== undefined) {
          accountBalances[tx.destinationAccountId] += amt;
        }
      });

      const enrichedAccounts = activeAccounts.map((acc) => ({
        ...acc,
        currentBalance: accountBalances[acc.id] ?? (Number(acc.initialBalance) || 0),
      }));

      const totalAllAccountsBalance = enrichedAccounts.reduce((s, a) => s + a.currentBalance, 0);
      const personalAndHouseholdAccounts = enrichedAccounts.filter((a) => a.owner !== 'business');
      const liquidPersonalHouseholdBalance = personalAndHouseholdAccounts.reduce((s, a) => s + a.currentBalance, 0);

      let incomeMe = 0;
      let incomeAyung = 0;
      let expenseMe = 0;
      let expenseAyung = 0;
      let expenseShared = 0;
      let sharedPaidByMe = 0;
      let sharedPaidByAyung = 0;
      let todayIncome = 0;
      let todayExpense = 0;

      activeTx.forEach((tx) => {
        const amt = Number(tx.amount) || 0;
        const isToday = tx.txDate === TODAY_STR;

        if (tx.txNature === 'personal_income') {
          if (tx.owner === 'me') incomeMe += amt;
          else if (tx.owner === 'ayung') incomeAyung += amt;
          else incomeMe += amt;
          if (isToday) todayIncome += amt;
        }

        if (tx.txNature === 'personal_expense') {
          if (tx.owner === 'me') expenseMe += amt;
          else if (tx.owner === 'ayung') expenseAyung += amt;
          else if (tx.owner === 'shared') {
            expenseShared += amt;
            if (tx.paidBy === 'me') sharedPaidByMe += amt;
            else if (tx.paidBy === 'ayung') sharedPaidByAyung += amt;
          }
          if (isToday) todayExpense += amt;
        }
      });

      const totalPersonalIncomeMonth = incomeMe + incomeAyung;
      const totalPersonalExpenseMonth = expenseMe + expenseAyung + expenseShared;

      const unitMetrics = activeUnits.map((unit) => {
        const unitInvoices = activeInvoices.filter((inv) => inv.businessUnitId === unit.id);
        const unitTx = activeTx.filter((tx) => tx.businessUnitId === unit.id);

        const grossRevenueOmzet = unitInvoices.reduce((s, inv) => s + (Number(inv.totalRevenueAmount) || 0), 0);

        const invoicePaidMap = {};
        unitInvoices.forEach((inv) => { invoicePaidMap[inv.id] = 0; });

        let cashReceivedTotal = 0;
        let businessExpensesTotal = 0;
        let ownerDrawsTotal = 0;

        unitTx.forEach((tx) => {
          const amt = Number(tx.amount) || 0;
          if (tx.txNature === 'business_cash_in') {
            cashReceivedTotal += amt;
            if (tx.businessInvoiceId && invoicePaidMap[tx.businessInvoiceId] !== undefined) {
              invoicePaidMap[tx.businessInvoiceId] += amt;
            }
          } else if (tx.txNature === 'business_expense') {
            businessExpensesTotal += amt;
          } else if (tx.txNature === 'owner_draw_transfer') {
            ownerDrawsTotal += amt;
          }
        });

        const totalReceivables = unitInvoices.reduce((s, inv) => {
          const paid = invoicePaidMap[inv.id] || 0;
          return s + Math.max(0, (Number(inv.totalRevenueAmount) || 0) - paid);
        }, 0);

        const netProfitAfterCost = grossRevenueOmzet - businessExpensesTotal;
        const cashAccount = enrichedAccounts.find((a) => a.id === unit.cashAccountId);
        const cashBalance = cashAccount ? cashAccount.currentBalance : 0;

        return {
          ...unit,
          grossRevenueOmzet,
          cashReceivedTotal,
          totalReceivables,
          businessExpensesTotal,
          ownerDrawsTotal,
          netProfitAfterCost,
          cashBalance,
          targetAchievementPct: unit.targetMonthlyRevenue > 0 ? Math.round((grossRevenueOmzet / unit.targetMonthlyRevenue) * 100) : 0,
        };
      });

      const businessConsolidated = unitMetrics.reduce(
        (acc, u) => ({
          totalOmzet: acc.totalOmzet + u.grossRevenueOmzet,
          totalCashIn: acc.totalCashIn + u.cashReceivedTotal,
          totalReceivables: acc.totalReceivables + u.totalReceivables,
          totalExpenses: acc.totalExpenses + u.businessExpensesTotal,
          totalNetProfit: acc.totalNetProfit + u.netProfitAfterCost,
          totalCashBalance: acc.totalCashBalance + u.cashBalance,
        }),
        { totalOmzet: 0, totalCashIn: 0, totalReceivables: 0, totalExpenses: 0, totalNetProfit: 0, totalCashBalance: 0 }
      );

      const enrichedAssets = (state.assets || []).map((ast) => {
        const isGold = ast.category === 'physical_gold' || ast.category === 'digital_gold';
        const liveUnitPrice = isGold ? state.goldCurrentPricePerGram : ast.estimatedCurrentPricePerUnit;
        const currentEstimatedValue = (Number(ast.quantity) || 0) * (Number(liveUnitPrice) || 0);
        const unrealizedGain = currentEstimatedValue - (Number(ast.totalCostBasis) || 0);
        return {
          ...ast,
          liveUnitPrice,
          currentEstimatedValue,
          unrealizedGain,
        };
      });

      const totalNonLiquidAssetsValue = enrichedAssets.reduce((s, a) => s + a.currentEstimatedValue, 0);
      const totalAssetsValue = totalAllAccountsBalance + totalNonLiquidAssetsValue;

      const activeDebts = (state.debts || []).filter((d) => d.status === 'active');
      const totalDebtPrincipal = activeDebts.reduce((s, d) => s + (Number(d.remainingPrincipal) || 0), 0);
      const totalMonthlyDebtInstallments = activeDebts.reduce((s, d) => s + (Number(d.installmentAmount) || 0), 0);

      const netWorth = totalAssetsValue - totalDebtPrincipal;

      const approvedAllocationsTotal = (state.allocations || [])
        .filter((al) => al.status === 'approved')
        .reduce((s, al) => s + (al.items || []).reduce((acc, i) => acc + (Number(i.amount) || 0), 0), 0);

      const unpaidSubscriptionsTotal = (state.subscriptions || [])
        .filter((sub) => sub.active)
        .reduce((s, sub) => s + (Number(sub.amount) || 0), 0);

      const earmarkedSavingsAccountBalance = enrichedAccounts
        .filter((a) => a.type === 'savings_account')
        .reduce((s, a) => s + a.currentBalance, 0);

      const upcomingObligationsTotal = totalMonthlyDebtInstallments + unpaidSubscriptionsTotal;
      const safeToSpend = Math.max(
        0,
        liquidPersonalHouseholdBalance - earmarkedSavingsAccountBalance - upcomingObligationsTotal - approvedAllocationsTotal
      );

      const enrichedBudgets = (state.budgets || []).map((bgt) => {
        const used = activeTx
          .filter((tx) => tx.txNature === 'personal_expense' && (tx.budgetId === bgt.id || tx.categoryId === bgt.categoryId))
          .reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
        const remaining = (Number(bgt.targetAmount) || 0) - used;
        const pct = bgt.targetAmount > 0 ? Math.round((used / bgt.targetAmount) * 100) : 0;
        return { ...bgt, used, remaining, pct };
      });

      const enrichedAllowances = (state.allowances || []).map((alw) => {
        const effectiveLimit = (Number(alw.limitAmount) || 0) + (alw.carryoverEnabled ? Number(alw.carryoverBalance) || 0 : 0);
        const used = activeTx
          .filter((tx) => tx.allowanceId === alw.id)
          .reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
        const remaining = effectiveLimit - used;
        const pct = effectiveLimit > 0 ? Math.round((used / effectiveLimit) * 100) : 0;
        return { ...alw, effectiveLimit, used, remaining, pct };
      });

      const targetShareMe = expenseShared * ((state.settlementRatioMe || 50) / 100);
      const targetShareAyung = expenseShared - targetShareMe;
      const settlementDiffMe = sharedPaidByMe - targetShareMe;

      return {
        enrichedAccounts,
        totalAllAccountsBalance,
        liquidPersonalHouseholdBalance,
        earmarkedSavingsAccountBalance,
        incomeMe,
        incomeAyung,
        expenseMe,
        expenseAyung,
        expenseShared,
        sharedPaidByMe,
        sharedPaidByAyung,
        targetShareMe,
        targetShareAyung,
        settlementDiffMe,
        totalPersonalIncomeMonth,
        totalPersonalExpenseMonth,
        todayIncome,
        todayExpense,
        unitMetrics,
        businessConsolidated,
        enrichedAssets,
        totalNonLiquidAssetsValue,
        totalAssetsValue,
        activeDebts,
        totalDebtPrincipal,
        totalMonthlyDebtInstallments,
        netWorth,
        upcomingObligationsTotal,
        approvedAllocationsTotal,
        safeToSpend,
        enrichedBudgets,
        enrichedAllowances,
        activeTx,
        activeInvoices,
      };
    }

    // ============================================================================
    // 4. REUSABLE UI COMPONENTS
    // ============================================================================
    const RetroCard = ({ children, className = '', bg = COLORS.card, borderColor = COLORS.olive }) => (

    // ============================================================================
    // 5. MAIN APPLICATION COMPONENT
    // ============================================================================
    function OurLittleFinanceApp() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return createCleanZeroState();
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.error(e);
        }
      }, [state]);

      const engine = useMemo(() => computeFinancialEngine(state), [state]);
      const isReadOnly = state.role === 'read_only';

      // Navigation State
      const [activeNav, setActiveNav] = useState('dashboard');
      const [dashSubTab, setDashSubTab] = useState('overview');
      const [cashSubTab, setCashSubTab] = useState('transactions');
      const [selectedBizUnit, setSelectedBizUnit] = useState('all');
      const [wealthSubTab, setWealthSubTab] = useState('accounts_assets');
      const [hubSubTab, setHubSubTab] = useState('reports');

      // Quick Transaction & Edit Transaction State
      const [isQuickTxOpen, setIsQuickTxOpen] = useState(false);
      const [editingTxId, setEditingTxId] = useState(null);
      const [txForm, setTxForm] = useState({
        mode: 'expense',
        amountStr: '0',
        categoryId: 'cat-makanan',
        sourceAccountId: 'acc-bca-me',
        destinationAccountId: 'acc-bca-me',
        owner: 'me',
        paidBy: 'me',
        allowanceId: '',
        budgetId: '',
        debtId: '',
        interestFeeAmount: '0',
        notes: '',
        attachmentName: '',
        txDate: TODAY_STR,
      });
      const [guardWarningModal, setGuardWarningModal] = useState(null);

      // Filters
      const [txSearch, setTxSearch] = useState('');
      const [txFilterOwner, setTxFilterOwner] = useState('all');
      const [txFilterCategory, setTxFilterCategory] = useState('all');
      const [catFilterFlow, setCatFilterFlow] = useState('all');

      // ----------------------------------------------------------------------
      // UNIVERSAL CRUD STATES FOR ALL MODULES (ADD / EDIT / DELETE EVERYTHING)
      // ----------------------------------------------------------------------
      // 1. Category CRUD
      const [editingCatId, setEditingCatId] = useState(null);
      const [catForm, setCatForm] = useState({ name: '', flow: 'expense', scope: 'household', isFavorite: true });

      // 2. Allowance CRUD
      const [editingAlwId, setEditingAlwId] = useState(null);

      const evaluateGuardForForm = (amountNum, allowanceId, budgetId) => {
        const allowance = engine.enrichedAllowances.find((a) => a.id === allowanceId);
        const budget = engine.enrichedBudgets.find((b) => b.id === budgetId);
        if (!allowance && !budget) return null;

        const oldEditingTx = editingTxId ? state.transactions.find((t) => t.id === editingTxId) : null;
        const oldAllowanceContribution =
          oldEditingTx && allowance && oldEditingTx.allowanceId === allowance.id ? Number(oldEditingTx.amount) || 0 : 0;
        const oldBudgetContribution =
          oldEditingTx && budget && oldEditingTx.txNature === 'personal_expense' && (oldEditingTx.budgetId === budget.id || oldEditingTx.categoryId === budget.categoryId)
            ? Number(oldEditingTx.amount) || 0
            : 0;

        const targetName = allowance ? allowance.name : budget.name;
        const limit = allowance ? allowance.effectiveLimit : budget.targetAmount;
        const rawUsedBefore = allowance ? allowance.used : budget.used;
        const usedBefore = Math.max(0, rawUsedBefore - (allowance ? oldAllowanceContribution : oldBudgetContribution));
        const newTotal = usedBefore + amountNum;
        const pct = limit > 0 ? Math.round((newTotal / limit) * 100) : 0;
        const excess = Math.max(0, newTotal - limit);

        return { targetName, limit, usedBefore, amountNum, newTotal, pct, excess };

                    <div>
                      <h3 className="text-base font-extrabold">Backup JSON & Reset Bersih (Rp0)</h3>
                      <p className="text-xs opacity-75">Unduh cadangan data Anda atau kembalikan seluruh aplikasi ke Rp0.</p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <RetroButton
                        bg={COLORS.green}
                        onClick={() => {
                          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = `our-little-finance-backup-${TODAY_STR}.json`;
                          a.click();
                          showToast('Backup JSON berhasil diunduh!');
                        }}
                      >
                        <Download className="h-4 w-4" /> Download Backup JSON
                      </RetroButton>
                      {!isReadOnly && (
                        <RetroButton bg={COLORS.red} onClick={handleResetAllToZero}>
                          <RotateCcw className="h-4 w-4" /> Reset Semua Jadi Rp0
                        </RetroButton>
                      )}
                    </div>
                  </RetroCard>
                )}
              </div>
            )}
          </main>

          {/* BOTTOM NAVIGATION BAR */}
          <nav
            className="fixed bottom-0 left-0 right-0 z-30 border-t-2 px-2 py-2"
            style={{ backgroundColor: COLORS.olive, borderColor: COLORS.olive, color: COLORS.cream }}
          >
            <div className="mx-auto flex max-w-md items-center justify-around">
              <button onClick={() => setActiveNav('dashboard')} className="flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-bold" style={{ color: activeNav === 'dashboard' ? COLORS.yellow : COLORS.cream }}>
                <Home className="h-5 w-5" />
                <span>Home</span>
              </button>
              <button onClick={() => setActiveNav('cashflow')} className="flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-bold" style={{ color: activeNav === 'cashflow' ? COLORS.yellow : COLORS.cream }}>
                <Wallet className="h-5 w-5" />
                <span>Cashflow</span>
              </button>
              <button
                disabled={isReadOnly}
                onClick={() => openNewTransactionModal('expense')}
                className="flex h-12 w-12 -translate-y-3 items-center justify-center rounded-2xl border-2 font-black shadow-lg disabled:opacity-40"
                style={{ backgroundColor: COLORS.pink, borderColor: COLORS.cream, color: '#FFF' }}
              >
                <Plus className="h-6 w-6" />
              </button>
              <button onClick={() => setActiveNav('business')} className="flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-bold" style={{ color: activeNav === 'business' ? COLORS.yellow : COLORS.cream }}>
                <Building2 className="h-5 w-5" />
                <span>Bisnis</span>
              </button>
              <button onClick={() => setActiveNav('wealth')} className="flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-bold" style={{ color: activeNav === 'wealth' ? COLORS.yellow : COLORS.cream }}>
                <Landmark className="h-5 w-5" />
                <span>Wealth</span>
              </button>
              <button onClick={() => setActiveNav('hub')} className="flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-bold" style={{ color: activeNav === 'hub' ? COLORS.yellow : COLORS.cream }}>
                <PieChart className="h-5 w-5" />
                <span>Laporan</span>
              </button>
            </div>
          </nav>

          {/* MODAL 1: QUICK TRANSACTION / EDIT TRANSACTION */}
          {isQuickTxOpen && (
            <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/60 p-2 sm:p-4">
              <div
                className="w-full max-w-lg rounded-2xl border-2 p-4 max-h-[92vh] overflow-y-auto"
                style={{ backgroundColor: COLORS.cream, borderColor: COLORS.olive, boxShadow: `6px 6px 0px ${COLORS.olive}` }}
              >
                <div className="flex items-center justify-between border-b-2 pb-2.5" style={{ borderColor: COLORS.olive }}>
                  <h3 className="text-base font-black">
                    {editingTxId ? '✏️ Edit Transaksi' : 'Tambah Transaksi Baru'}
                  </h3>
                  <button onClick={() => { setEditingTxId(null); setIsQuickTxOpen(false); }} className="rounded-lg border p-1" style={{ borderColor: COLORS.olive }}>
                    <X className="h-4 w-4" />
                  </button>
                </div>

                <div className="mt-3 grid grid-cols-4 gap-1.5 text-xs">
                  {[
                    { id: 'expense', label: 'Pengeluaran', bg: COLORS.red },
                    { id: 'income', label: 'Pemasukan', bg: COLORS.green },
                    { id: 'transfer', label: 'Transfer', bg: COLORS.olive },
                    { id: 'debt_payment', label: 'Bayar Utang', bg: COLORS.pink },
                  ].map((m) => (
                    <button
                      key={m.id}
                      type="button"
                      onClick={() => {
                        const defaultCat = state.categories.find((c) => c.flow === (m.id === 'income' ? 'income' : 'expense'));
                        setTxForm((p) => ({ ...p, mode: m.id, categoryId: defaultCat ? defaultCat.id : p.categoryId }));
                      }}
                      className="rounded-xl border-2 py-2 font-extrabold"
                      style={{
                        borderColor: COLORS.olive,
                        backgroundColor: txForm.mode === m.id ? m.bg : COLORS.card,
                        color: txForm.mode === m.id ? '#FFF' : COLORS.olive,
                      }}
                    >
                      {m.label}
                    </button>
                  ))}
                </div>

                <div className="mt-3 rounded-xl border-2 p-3 text-right" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}>
                  <div className="text-[11px] font-bold uppercase opacity-70">Nominal ({txForm.mode}) — Bisa Ketik Langsung atau Pakai Tombol</div>
                  <input
                    type="number"
                    value={txForm.amountStr === '0' ? '' : txForm.amountStr}
                    onChange={(e) => setTxForm((p) => ({ ...p, amountStr: e.target.value || '0' }))}
                    placeholder="0"
                    className="w-full text-right text-2xl font-black bg-transparent outline-none"
                  />
                  <div className="text-xs font-bold opacity-75">{formatIDR(txForm.amountStr)}</div>
                </div>

                <div className="mt-2.5 grid grid-cols-4 gap-1.5 text-sm font-black">
                  {['1', '2', '3', 'C', '4', '5', '6', '000', '7', '8', '9', '⌫', '0', '50000', '100000'].map((key) => (
                    <button
                      key={key}
                      type="button"
                      onClick={() => {
                        setTxForm((p) => {
                          if (key === 'C') return { ...p, amountStr: '0' };
                          if (key === '⌫') return { ...p, amountStr: p.amountStr.slice(0, -1) || '0' };
                          if (key === '50000' || key === '100000') return { ...p, amountStr: key };
                          const clean = p.amountStr === '0' ? '' : p.amountStr;
                          return { ...p, amountStr: clean + key };
                        });
                      }}
                      className={`rounded-xl border-2 py-2 ${key === '100000' ? 'col-span-2' : ''}`}
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    >
                      {key === '50000' ? '50rb' : key === '100000' ? '100rb' : key}
                    </button>
                  ))}
                </div>

                <div className="mt-3 grid grid-cols-1 gap-2.5 sm:grid-cols-2 text-xs">
                  {(txForm.mode === 'expense' || txForm.mode === 'income') && (
                    <div className="sm:col-span-2">
                      <label className="font-bold block mb-1">Kategori:</label>
                      <select
                        value={txForm.categoryId}
                        onChange={(e) => setTxForm((p) => ({ ...p, categoryId: e.target.value }))}
                        className="w-full rounded-xl border-2 p-2 font-bold"
                        style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                      >
                        {state.categories.map((cat) => (
                          <option key={cat.id} value={cat.id}>
                            [{cat.flow === 'income' ? 'Pemasukan' : 'Pengeluaran'}] {cat.name}
                          </option>
                        ))}
                      </select>
                    </div>
                  )}

                  {txForm.mode !== 'income' && (
                    <div>
                      <label className="font-bold block mb-1">Rekening Sumber:</label>
                      <select
                        value={txForm.sourceAccountId}
                        onChange={(e) => setTxForm((p) => ({ ...p, sourceAccountId: e.target.value }))}
                        className="w-full rounded-xl border-2 p-2 font-bold"
                        style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                      >
                        {engine.enrichedAccounts.map((a) => (
                          <option key={a.id} value={a.id}>{a.name} ({formatIDR(a.currentBalance)})</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {(txForm.mode === 'income' || txForm.mode === 'transfer') && (
                    <div>
                      <label className="font-bold block mb-1">Rekening Tujuan:</label>
                      <select
                        value={txForm.destinationAccountId}
                        onChange={(e) => setTxForm((p) => ({ ...p, destinationAccountId: e.target.value }))}
                        className="w-full rounded-xl border-2 p-2 font-bold"
                        style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                      >
                        {engine.enrichedAccounts.map((a) => (
                          <option key={a.id} value={a.id}>{a.name} ({formatIDR(a.currentBalance)})</option>
                        ))}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="font-bold block mb-1">Tanggal:</label>
                    <input
                      type="date"
                      value={txForm.txDate}
                      onChange={(e) => setTxForm((p) => ({ ...p, txDate: e.target.value }))}
                      className="w-full rounded-xl border-2 p-2 font-bold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Kepemilikan:</label>
                    <select
                      value={txForm.owner}
                      onChange={(e) => setTxForm((p) => ({ ...p, owner: e.target.value }))}
                      className="w-full rounded-xl border-2 p-2 font-bold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    >
                      <option value="me">Milik Saya (Intan)</option>
                      <option value="ayung">Milik Ayung</option>
                      <option value="shared">Milik Bersama</option>
                      <option value="business">Bisnis</option>
                    </select>
                  </div>

                  <div className="sm:col-span-2">
                    <label className="font-bold block mb-1">Catatan:</label>
                    <input
                      type="text"
                      value={txForm.notes}
                      onChange={(e) => setTxForm((p) => ({ ...p, notes: e.target.value }))}
                      placeholder="Ketik keterangan transaksi..."
                      className="w-full rounded-xl border-2 p-2 font-semibold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    />
                  </div>
                </div>

                <div className="mt-4 flex justify-end gap-2">
                  <RetroButton bg={COLORS.card} textColor={COLORS.olive} onClick={() => { setEditingTxId(null); setIsQuickTxOpen(false); }}>
                    Batal
                  </RetroButton>
                  <RetroButton bg={editingTxId ? COLORS.green : COLORS.pink} onClick={() => commitTransaction(false)}>
                    {editingTxId ? 'Simpan Perubahan' : 'Simpan Transaksi'}
                  </RetroButton>
                </div>
              </div>
            </div>
          )}

          {/* MODAL UNIT BISNIS */}
          {unitFormModal && (
            <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60 p-4">
              <form onSubmit={handleSaveBusinessUnit} className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3" style={{ backgroundColor: COLORS.cream, borderColor: COLORS.olive }}>
                <h3 className="text-base font-black">{editingUnitId ? '✏️ Edit Unit Bisnis' : '+ Tambah Unit Bisnis Baru'}</h3>
                <div className="space-y-2 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Nama Unit Bisnis:</label>
                    <input type="text" required value={unitForm.name} onChange={(e) => setUnitForm((p) => ({ ...p, name: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }} />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Modal Bisnis (Rp):</label>
                    <input type="number" value={unitForm.capitalInvested} onChange={(e) => setUnitForm((p) => ({ ...p, capitalInvested: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }} />
                  </div>
                </div>
                <div className="flex justify-end gap-2">
                  <RetroButton bg={COLORS.card} textColor={COLORS.olive} onClick={() => setUnitFormModal(false)}>Batal</RetroButton>
                  <RetroButton type="submit" bg={COLORS.green}>Simpan Unit</RetroButton>
                </div>
              </form>
            </div>
          )}

          {/* MODAL INVOICE BISNIS */}
          {newInvoiceModal && (
            <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60 p-4">
              <form onSubmit={handleCreateOrEditBusinessInvoice} className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3" style={{ backgroundColor: COLORS.cream, borderColor: COLORS.olive }}>
                <h3 className="text-base font-black">{editingInvoiceId ? '✏️ Edit Invoice Proyek' : 'Catat Invoice Proyek & DP'}</h3>
                <div className="space-y-2 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Unit Bisnis:</label>
                    <select value={invoiceForm.businessUnitId} onChange={(e) => setInvoiceForm((p) => ({ ...p, businessUnitId: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}>
                      {state.businessUnits.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Nama Proyek / Klien:</label>
                    <input type="text" required value={invoiceForm.title} onChange={(e) => setInvoiceForm((p) => ({ ...p, title: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }} />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Total Nilai Invoice / Omzet (Rp):</label>
                    <input type="number" required value={invoiceForm.totalRevenueAmount} onChange={(e) => setInvoiceForm((p) => ({ ...p, totalRevenueAmount: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }} />
                  </div>
                  {!editingInvoiceId && (
                    <div>
                      <label className="font-bold block mb-1">Uang DP Diterima Saat Ini (Rp):</label>
                      <input type="number" value={invoiceForm.dpAmount} onChange={(e) => setInvoiceForm((p) => ({ ...p, dpAmount: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }} />
                    </div>
                  )}
                </div>
                <div className="flex justify-end gap-2">
                  <RetroButton bg={COLORS.card} textColor={COLORS.olive} onClick={() => setNewInvoiceModal(false)}>Batal</RetroButton>
                  <RetroButton type="submit" bg={COLORS.green}>Simpan</RetroButton>
                </div>
              </form>
            </div>
          )}

          {/* MODAL OWNER DRAW */}
          {ownerDrawModal && (
            <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60 p-4">
              <form onSubmit={handleOwnerDraw} className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3" style={{ backgroundColor: COLORS.cream, borderColor: COLORS.olive }}>
                <h3 className="text-base font-black">Transfer Laba Bisnis ke Pribadi</h3>
                <div className="space-y-2 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Dari Unit Bisnis:</label>
                    <select value={ownerDrawForm.businessUnitId} onChange={(e) => setOwnerDrawForm((p) => ({ ...p, businessUnitId: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}>
                      {engine.unitMetrics.map((u) => <option key={u.id} value={u.id}>{u.name} (Kas: {formatIDR(u.cashBalance)})</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Ke Rekening Pribadi:</label>
                    <select value={ownerDrawForm.destinationAccountId} onChange={(e) => setOwnerDrawForm((p) => ({ ...p, destinationAccountId: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}>
                      {engine.enrichedAccounts.filter((a) => a.owner !== 'business').map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Nominal Transfer (Rp):</label>
                    <input type="number" required value={ownerDrawForm.amount} onChange={(e) => setOwnerDrawForm((p) => ({ ...p, amount: e.target.value }))} className="w-full rounded-xl border-2 p-2 font-bold" style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }} />
                  </div>
                </div>
                <div className="flex justify-end gap-2">
                  <RetroButton bg={COLORS.card} textColor={COLORS.olive} onClick={() => setOwnerDrawModal(false)}>Batal</RetroButton>
                  <RetroButton type="submit" bg={COLORS.pink}>Transfer Sekarang</RetroButton>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<OurLittleFinanceApp />);
  </script>
</body>
</html>
