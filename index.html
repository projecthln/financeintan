    // ============================================================================
    // 3. CENTRAL ACCOUNTING ENGINE (STRICT 12 ACCOUNTING RULES)
    // ============================================================================
    function computeFinancialEngine(state) {
      const activeAccounts = state.accounts.filter((a) => !a.deletedAt && !a.isArchived);
      const activeTx = state.transactions.filter((t) => !t.deletedAt);
      const activeInvoices = state.businessInvoices.filter((inv) => !inv.deletedAt && inv.status !== 'cancelled');
      const activeUnits = state.businessUnits.filter((u) => !u.deletedAt && !u.isArchived);

      // RULE 1 & 12: Account Balance Reconciled Strictly from Initial Balance + Cleared Flows
      const accountBalances = {};
      activeAccounts.forEach((acc) => {
        accountBalances[acc.id] = Number(acc.initialBalance) || 0;
      });

      activeTx.forEach((tx) => {
        const amt = Number(tx.amount) || 0;
        if (tx.sourceAccountId && accountBalances[tx.sourceAccountId] !== undefined) {
          accountBalances[tx.sourceAccountId] -= amt;
        }
        if (tx.destinationAccountId && accountBalances[tx.destinationAccountId] !== undefined) {
          accountBalances[tx.destinationAccountId] += amt;
        }
      });

      const enrichedAccounts = activeAccounts.map((acc) => ({
        ...acc,
        currentBalance: accountBalances[acc.id] ?? acc.initialBalance,
      }));

      const totalAllAccountsBalance = enrichedAccounts.reduce((s, a) => s + a.currentBalance, 0);
      const personalAndHouseholdAccounts = enrichedAccounts.filter((a) => a.owner !== 'business');
      const liquidPersonalHouseholdBalance = personalAndHouseholdAccounts.reduce((s, a) => s + a.currentBalance, 0);

      // Personal & Household Income vs Expense (Excludes Transfers, Owner Draws, Allocations, Savings, Asset Purchases)
      let incomeMe = 0;
      let incomeAyung = 0;
      let expenseMe = 0;
      let expenseAyung = 0;
      let expenseShared = 0;
      let sharedPaidByMe = 0;
      let sharedPaidByAyung = 0;
      let todayIncome = 0;
      let todayExpense = 0;

      activeTx.forEach((tx) => {
        const amt = Number(tx.amount) || 0;
        const isToday = tx.txDate === TODAY_STR;

        if (tx.txNature === 'personal_income') {
          if (tx.owner === 'me') incomeMe += amt;
          else if (tx.owner === 'ayung') incomeAyung += amt;
          else incomeMe += amt;
          if (isToday) todayIncome += amt;
        }

        if (tx.txNature === 'personal_expense') {
          if (tx.owner === 'me') expenseMe += amt;
          else if (tx.owner === 'ayung') expenseAyung += amt;
          else if (tx.owner === 'shared') {
            expenseShared += amt;
            if (tx.paidBy === 'me') sharedPaidByMe += amt;
            else if (tx.paidBy === 'ayung') sharedPaidByAyung += amt;
          }
          if (isToday) todayExpense += amt;
        }
      });

      const totalPersonalIncomeMonth = incomeMe + incomeAyung;
      const totalPersonalExpenseMonth = expenseMe + expenseAyung + expenseShared;

      // RULE 5, 7, 8: Business Finance Per Unit
      const unitMetrics = activeUnits.map((unit) => {
        const unitInvoices = activeInvoices.filter((inv) => inv.businessUnitId === unit.id);
        const unitTx = activeTx.filter((tx) => tx.businessUnitId === unit.id);

        const grossRevenueOmzet = unitInvoices.reduce((s, inv) => s + (Number(inv.totalRevenueAmount) || 0), 0);

        const invoicePaidMap = {};
        unitInvoices.forEach((inv) => { invoicePaidMap[inv.id] = 0; });

        let cashReceivedTotal = 0;
        let businessExpensesTotal = 0;
        let ownerDrawsTotal = 0;

        unitTx.forEach((tx) => {
          const amt = Number(tx.amount) || 0;
          if (tx.txNature === 'business_cash_in') {
            cashReceivedTotal += amt;
            if (tx.businessInvoiceId && invoicePaidMap[tx.businessInvoiceId] !== undefined) {
              invoicePaidMap[tx.businessInvoiceId] += amt;
            }
          } else if (tx.txNature === 'business_expense') {
            businessExpensesTotal += amt;
          } else if (tx.txNature === 'owner_draw_transfer') {
            ownerDrawsTotal += amt;
          }
        });

        const totalReceivables = unitInvoices.reduce((s, inv) => {
          const paid = invoicePaidMap[inv.id] || 0;
          return s + Math.max(0, (Number(inv.totalRevenueAmount) || 0) - paid);
        }, 0);

        const netProfitAfterCost = grossRevenueOmzet - businessExpensesTotal;
        const cashAccount = enrichedAccounts.find((a) => a.id === unit.cashAccountId);
        const cashBalance = cashAccount ? cashAccount.currentBalance : 0;

        return {
          ...unit,
          grossRevenueOmzet,
          cashReceivedTotal,
          totalReceivables,
          businessExpensesTotal,
          ownerDrawsTotal,
          netProfitAfterCost,
          cashBalance,
          targetAchievementPct: unit.targetMonthlyRevenue > 0 ? Math.round((grossRevenueOmzet / unit.targetMonthlyRevenue) * 100) : 0,
        };
      });

      const businessConsolidated = unitMetrics.reduce(
        (acc, u) => ({
          totalOmzet: acc.totalOmzet + u.grossRevenueOmzet,
          totalCashIn: acc.totalCashIn + u.cashReceivedTotal,
          totalReceivables: acc.totalReceivables + u.totalReceivables,
          totalExpenses: acc.totalExpenses + u.businessExpensesTotal,
          totalNetProfit: acc.totalNetProfit + u.netProfitAfterCost,
          totalCashBalance: acc.totalCashBalance + u.cashBalance,
        }),
        { totalOmzet: 0, totalCashIn: 0, totalReceivables: 0, totalExpenses: 0, totalNetProfit: 0, totalCashBalance: 0 }
      );

      // RULE 4 & 9: Assets & Unrealized Gains
      const enrichedAssets = state.assets.map((ast) => {
        const isGold = ast.category === 'physical_gold' || ast.category === 'digital_gold';
        const liveUnitPrice = isGold ? state.goldCurrentPricePerGram : ast.estimatedCurrentPricePerUnit;
        const currentEstimatedValue = (Number(ast.quantity) || 0) * (Number(liveUnitPrice) || 0);
        const unrealizedGain = currentEstimatedValue - (Number(ast.totalCostBasis) || 0);
        return {
          ...ast,
          liveUnitPrice,
          currentEstimatedValue,
          unrealizedGain,
        };
      });

      const totalNonLiquidAssetsValue = enrichedAssets.reduce((s, a) => s + a.currentEstimatedValue, 0);
      const totalAssetsValue = totalAllAccountsBalance + totalNonLiquidAssetsValue;

      // RULE 6: Debt & Liabilities
      const activeDebts = state.debts.filter((d) => d.status === 'active');
      const totalDebtPrincipal = activeDebts.reduce((s, d) => s + (Number(d.remainingPrincipal) || 0), 0);
      const totalMonthlyDebtInstallments = activeDebts.reduce((s, d) => s + (Number(d.installmentAmount) || 0), 0);

      const netWorth = totalAssetsValue - totalDebtPrincipal;

      // RULE 2 & 17: Safe-to-Spend Calculation
      const approvedAllocationsTotal = state.allocations
        .filter((al) => al.status === 'approved')
        .reduce((s, al) => s + al.items.reduce((acc, i) => acc + (Number(i.amount) || 0), 0), 0);

      const unpaidSubscriptionsTotal = state.subscriptions
        .filter((sub) => sub.active)
        .reduce((s, sub) => s + (Number(sub.amount) || 0), 0);

      const earmarkedSavingsAccountBalance = enrichedAccounts
        .filter((a) => a.type === 'savings_account')
        .reduce((s, a) => s + a.currentBalance, 0);

      const upcomingObligationsTotal = totalMonthlyDebtInstallments + unpaidSubscriptionsTotal;
      const safeToSpend = Math.max(
        0,
        liquidPersonalHouseholdBalance - earmarkedSavingsAccountBalance - upcomingObligationsTotal - approvedAllocationsTotal
      );

      // Budgets & Allowances Live Usage
      const enrichedBudgets = state.budgets.map((bgt) => {
        const used = activeTx
          .filter((tx) => tx.txNature === 'personal_expense' && (tx.budgetId === bgt.id || tx.categoryId === bgt.categoryId))
          .reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
        const remaining = bgt.targetAmount - used;
        const pct = bgt.targetAmount > 0 ? Math.round((used / bgt.targetAmount) * 100) : 0;
        return { ...bgt, used, remaining, pct };
      });

      const enrichedAllowances = state.allowances.map((alw) => {
        const effectiveLimit = (Number(alw.limitAmount) || 0) + (alw.carryoverEnabled ? Number(alw.carryoverBalance) || 0 : 0);
        const used = activeTx
          .filter((tx) => tx.allowanceId === alw.id)
          .reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
        const remaining = effectiveLimit - used;
        const pct = effectiveLimit > 0 ? Math.round((used / effectiveLimit) * 100) : 0;
        return { ...alw, effectiveLimit, used, remaining, pct };
      });

      // Shared Expense Settlement
      const targetShareMe = (expenseShared * (state.settlementRatioMe / 100));
      const targetShareAyung = expenseShared - targetShareMe;
      const settlementDiffMe = sharedPaidByMe - targetShareMe;

      return {
        enrichedAccounts,
        totalAllAccountsBalance,
        liquidPersonalHouseholdBalance,
        earmarkedSavingsAccountBalance,
        incomeMe,
        incomeAyung,
        expenseMe,
        expenseAyung,
        expenseShared,
        sharedPaidByMe,
        sharedPaidByAyung,
        targetShareMe,
        targetShareAyung,
        settlementDiffMe,
        totalPersonalIncomeMonth,
        totalPersonalExpenseMonth,
        todayIncome,
        todayExpense,
        unitMetrics,
        businessConsolidated,
        enrichedAssets,
        totalNonLiquidAssetsValue,
        totalAssetsValue,
        activeDebts,
        totalDebtPrincipal,
        totalMonthlyDebtInstallments,
        netWorth,
        upcomingObligationsTotal,
        approvedAllocationsTotal,
        safeToSpend,
        enrichedBudgets,
        enrichedAllowances,
        activeTx,
        activeInvoices,
      };
    }

        if (!allowance && !budget) return null;

        const targetName = allowance ? allowance.name : budget.name;
        const limit = allowance ? allowance.effectiveLimit : budget.targetAmount;
        const usedBefore = allowance ? allowance.used : budget.used;
        const newTotal = usedBefore + amountNum;
        const pct = limit > 0 ? Math.round((newTotal / limit) * 100) : 0;
        const excess = Math.max(0, newTotal - limit);

            notes: txForm.notes || `Pembayaran cicilan utang (Pokok: ${formatIDR(principal)})`,
            deletedAt: null,
          };
        }

        setState((prev) => {
          const updatedDebts =
            txForm.mode === 'debt_payment'
              ? prev.debts.map((d) =>
                  d.id === txForm.debtId
                    ? {
                        ...d,
                        remainingPrincipal: Math.max(0, d.remainingPrincipal - newTx.principalAmount),
                        paidInstallments: d.paidInstallments + 1,
                        status: d.remainingPrincipal - newTx.principalAmount <= 0 ? 'paid' : 'active',
                      }
                    : d
                )
              : prev.debts;

          const updatedAllocations =
            txForm.mode === 'income'
              ? [
                  {
                    id: 'alloc-' + Date.now(),
                    sourceTitle: `${newTx.notes} (${formatIDR(amt)})`,
                    incomeAmount: amt,
                    date: TODAY_STR,
                    status: 'draft',
                    items: [
                      { id: 'i1', label: 'Kebutuhan Rumah (35%)', percentage: 35, amount: Math.round(amt * 0.35) },
                      { id: 'i2', label: 'Cicilan & Kewajiban (20%)', percentage: 20, amount: Math.round(amt * 0.2) },
                      { id: 'i3', label: 'Tabungan (15%)', percentage: 15, amount: Math.round(amt * 0.15) },
                      { id: 'i4', label: 'Dana Darurat (10%)', percentage: 10, amount: Math.round(amt * 0.1) },
                      { id: 'i5', label: 'Kebutuhan Pribadi (10%)', percentage: 10, amount: Math.round(amt * 0.1) },
                      { id: 'i6', label: 'Dana Fleksibel (10%)', percentage: 10, amount: Math.round(amt * 0.1) },
                    ],
                  },
                  ...prev.allocations,
                ]
              : prev.allocations;

          return {
            ...prev,
            transactions: [newTx, ...prev.transactions],
            debts: updatedDebts,
            allocations: updatedAllocations,
          };
        });

        logActivity('CREATE_TX', `Mencatat transaksi ${txForm.mode} sebesar ${formatIDR(amt)}`);
        setGuardWarningModal(null);
        setIsQuickTxOpen(false);
        showToast(
          txForm.mode === 'income'
            ? 'Pemasukan tersimpan & Draft Smart Allocation siap ditinjau!'

      const handleCoolingOff = (durationLabel) => {
        if (!guardWarningModal) return;
        const item = {
          id: 'cool-' + Date.now(),
          amount: Number(txForm.amountStr) || 0,
          notes: txForm.notes || 'Pengeluaran tertunda Cooling-off',
          durationLabel,
          createdAt: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),

        setState((prev) => ({
          ...prev,
          coolingOffQueue: [item, ...prev.coolingOffQueue],

        setGuardWarningModal(null);

        showToast(`Disimpan ke Cooling-off Reminder (${durationLabel}). Pikirkan dengan tenang!`);

      const handleCreateBusinessInvoice = (e) => {
        e.preventDefault();
        if (isReadOnly) return;
        const omzet = Number(invoiceForm.totalRevenueAmount) || 0;
        const dp = Number(invoiceForm.dpAmount) || 0;
        if (omzet <= 0) return;

        const invId = 'inv-' + Date.now();
        const unit = state.businessUnits.find((u) => u.id === invoiceForm.businessUnitId);

        const newInv = {
          id: invId,
          businessUnitId: invoiceForm.businessUnitId,
          title: invoiceForm.title || 'Invoice Proyek Baru',
          invoiceDate: TODAY_STR,
          dueDate: invoiceForm.dueDate,
          totalRevenueAmount: omzet,
          notes: `Omzet ${formatIDR(omzet)}, DP awal ${formatIDR(dp)}`,
          status: dp >= omzet ? 'paid' : dp > 0 ? 'partial_dp' : 'unpaid',
          deletedAt: null,
        };

        const dpTx =
          dp > 0
            ? {
                id: 'tx-dp-' + Date.now(),
                txDate: TODAY_STR,
                amount: dp,
                txNature: 'business_cash_in',
                owner: 'business',
                paidBy: 'me',
                sourceAccountId: null,
                destinationAccountId: unit ? unit.cashAccountId : 'acc-biz-namistudio',
                categoryId: 'cat-biz-rev',
                businessUnitId: invoiceForm.businessUnitId,
                businessInvoiceId: invId,
                allowanceId: null,
                budgetId: null,
                debtId: null,
                principalAmount: 0,
                interestFeeAmount: 0,
                goalId: null,
                wishlistId: null,
                exceededGuard: false,
                guardExcessAmount: 0,
                attachmentName: '',
                notes: `Penerimaan DP: ${newInv.title}`,
                deletedAt: null,
              }
            : null;

        setState((prev) => ({
          ...prev,
          businessInvoices: [newInv, ...prev.businessInvoices],
          transactions: dpTx ? [dpTx, ...prev.transactions] : prev.transactions,
        }));

        setNewInvoiceModal(false);
        logActivity('CREATE_INVOICE', `Membuat invoice ${newInv.title} (Omzet ${formatIDR(omzet)}, DP ${formatIDR(dp)})`);
        showToast('Invoice proyek & penerimaan kas DP berhasil dicatat terpisah dari piutang!');
      };

      const handleSettleReceivable = (invoice, remainingAmount) => {
        if (isReadOnly || remainingAmount <= 0) return;
        const unit = state.businessUnits.find((u) => u.id === invoice.businessUnitId);
        const settlementTx = {
          id: 'tx-settle-' + Date.now(),
          txDate: TODAY_STR,
          amount: remainingAmount,
          txNature: 'business_cash_in',
          owner: 'business',
          paidBy: 'me',
          sourceAccountId: null,
          destinationAccountId: unit ? unit.cashAccountId : 'acc-biz-namistudio',
          categoryId: 'cat-biz-rev',
          businessUnitId: invoice.businessUnitId,
          businessInvoiceId: invoice.id,
          allowanceId: null,
          budgetId: null,
          debtId: null,
          principalAmount: 0,
          interestFeeAmount: 0,
          goalId: null,
          wishlistId: null,
          exceededGuard: false,
          guardExcessAmount: 0,
          attachmentName: '',
          notes: `Pelunasan Piutang: ${invoice.title} (Tanpa mencatat omzet dua kali)`,
          deletedAt: null,

        setState((prev) => ({
          ...prev,
          transactions: [settlementTx, ...prev.transactions],

      };

      const handleOwnerDraw = (e) => {

CREATE TABLE households (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  name TEXT NOT NULL DEFAULT 'Our Little Finance',
  created_at TIMESTAMPTZ DEFAULT now()
);

CREATE TABLE user_profiles (
  id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
  household_id UUID NOT NULL REFERENCES households(id),
  display_name TEXT NOT NULL,
  role TEXT NOT NULL CHECK (role IN ('primary_admin', 'read_only'))
);

-- Helper RLS Function: Hanya Primary Admin yang boleh INSERT/UPDATE/DELETE
CREATE OR REPLACE FUNCTION is_household_admin(target_household UUID)
RETURNS BOOLEAN AS $$
  SELECT EXISTS (
    SELECT 1 FROM user_profiles
    WHERE id = auth.uid()
      AND household_id = target_household
      AND role = 'primary_admin'
  );

                      onChange={(e) => setInvoiceForm((p) => ({ ...p, title: e.target.value }))}
                      placeholder="Contoh: Desain Undangan Digital / Web App"
                      className="w-full rounded-xl border-2 p-2 font-bold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Total Nilai Invoice / Omzet (Rp):</label>
                    <input
                      type="number"
                      required
                      value={invoiceForm.totalRevenueAmount}
                      onChange={(e) => setInvoiceForm((p) => ({ ...p, totalRevenueAmount: e.target.value }))}
                      className="w-full rounded-xl border-2 p-2 font-bold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Uang DP Diterima Saat Ini (Rp):</label>
                    <input
                      type="number"
                      required
                      value={invoiceForm.dpAmount}
                      onChange={(e) => setInvoiceForm((p) => ({ ...p, dpAmount: e.target.value }))}
                      className="w-full rounded-xl border-2 p-2 font-bold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <RetroButton bg={COLORS.card} textColor={COLORS.olive} onClick={() => setNewInvoiceModal(false)}>
                    Batal
                  </RetroButton>
                  <RetroButton type="submit" bg={COLORS.green}>
                    Simpan Invoice & DP
                  </RetroButton>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 4: OWNER DRAW (TRANSFER BISNIS KE PRIBADI) */}
          {ownerDrawModal && (
            <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60 p-4">
              <form
                onSubmit={handleOwnerDraw}
                className="w-full max-w-md rounded-2xl border-2 p-4 space-y-3"
                style={{ backgroundColor: COLORS.cream, borderColor: COLORS.olive, boxShadow: `6px 6px 0px ${COLORS.olive}` }}
              >
                <h3 className="text-base font-black">Penarikan Keuntungan Bisnis ke Rekening Pribadi</h3>
                <p className="text-xs opacity-80">
                  Sesuai Aturan #7: Saldo kas bisnis berkurang & rekening pribadi bertambah tanpa dihitung sebagai omzet baru.
                </p>
                <div className="space-y-2 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Dari Unit Bisnis:</label>
                    <select
                      value={ownerDrawForm.businessUnitId}
                      onChange={(e) => setOwnerDrawForm((p) => ({ ...p, businessUnitId: e.target.value }))}
                      className="w-full rounded-xl border-2 p-2 font-bold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    >
                      {engine.unitMetrics.map((u) => (
                        <option key={u.id} value={u.id}>
                          {u.name} (Kas Tersedia: {formatIDR(u.cashBalance)})
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Ke Rekening Pribadi / Rumah Tangga:</label>
                    <select
                      value={ownerDrawForm.destinationAccountId}
                      onChange={(e) => setOwnerDrawForm((p) => ({ ...p, destinationAccountId: e.target.value }))}
                      className="w-full rounded-xl border-2 p-2 font-bold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    >
                      {engine.enrichedAccounts
                        .filter((a) => a.owner !== 'business')
                        .map((a) => (
                          <option key={a.id} value={a.id}>{a.name}</option>
                        ))}
                    </select>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Nominal Transfer (Rp):</label>
                    <input
                      type="number"
                      required
                      value={ownerDrawForm.amount}
                      onChange={(e) => setOwnerDrawForm((p) => ({ ...p, amount: e.target.value }))}
                      className="w-full rounded-xl border-2 p-2 font-bold"
                      style={{ borderColor: COLORS.olive, backgroundColor: COLORS.card }}
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <RetroButton bg={COLORS.card} textColor={COLORS.olive} onClick={() => setOwnerDrawModal(false)}>
                    Batal
                  </RetroButton>
                  <RetroButton type="submit" bg={COLORS.pink}>
                    Transfer Keuntungan Sekarang
                  </RetroButton>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<OurLittleFinanceApp />);
  </script>
</body>
</html>
