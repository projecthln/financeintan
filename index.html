<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Little Finance — Intan & Ayung</title>
  <meta name="theme-color" content="#303D32" />

  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F5EBD9; }
  </style>

  <!-- 3. Babel Standalone (Agar browser bisa baca JSX langsung) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 4. Import Map untuk React & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- 5. TEMPEL KODE APP.JSX DI DALAM SCRIPT INI -->
  <script type="text/babel" data-type="module">
    import { createRoot } from 'react-dom/client';

    // =========================================================
    // TEMPEL ISI KODE APP.JSX KAMU DI SINI
    // (Mulai dari: import React, { useState... } sampai akhir)
    // JANGAN IKUTKAN TANDA ```react DI AWAL DAN ``` DI AKHIR!
    // =========================================================



    // =========================================================
    // UBAH BARIS PALING BAWAH:
    // Jika di paling bawah kode kamu ada tulisan: export default function OurLittleFinanceApp()
    // Hapus kata "export default", cukup tulis: function OurLittleFinanceApp()
    // Lalu biarkan 2 baris render di bawah ini berada paling akhir:
    // =========================================================
    const root = createRoot(document.getElementById('root'));
    root.render(<OurLittleFinanceApp />);
  </script>
</body>
</html>
